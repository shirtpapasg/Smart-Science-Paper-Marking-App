<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Science Marking · Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Same exercise-book palette as the app. Every colour is a variable, set once
     for light and once for dark. */
  :root{
    --ink:#1d2a44; --bg:#fbfaf3; --surface:#f1f5fb; --rule:#d5dbe7;
    --mid:#4d5b76; --accent:#1f8a4c; --accent-bg:rgba(31,138,76,.12);
    --faint:#8a95ab; --card:#ffffff; --grid:rgba(96,140,196,.15);
    --margin:#e2646a; --pen-dark:#166b3b;
    --hl:#ffd84d; --hl-soft:rgba(255,216,77,.35); --hl-ink:#5a4600;
    --warn:#c9741b; --warn-bg:rgba(201,116,27,.12);
    --round:'Fredoka','Nunito',ui-rounded,system-ui,sans-serif;
    --body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
    --hand:'Caveat','Segoe Script',cursive;
  }
  html[data-theme="dark"]{
    --ink:#eef1f7; --bg:#141a27; --surface:#222c3f; --rule:#2c3549;
    --mid:#b6bfd1; --accent:#4fc47f; --accent-bg:rgba(79,196,127,.14);
    --faint:#7c879d; --card:#1c2434; --grid:rgba(120,160,220,.10);
    --margin:#d8686e; --pen-dark:#0f5c31;
    --hl:#f3c93a; --hl-soft:rgba(243,201,58,.20); --hl-ink:#f8e7a0;
    --warn:#e9a35a; --warn-bg:rgba(233,163,90,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;
    background-color:var(--bg);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:28px 28px;background-attachment:fixed}
  .wrap{max-width:720px;margin:0 auto;padding:22px 22px 80px 44px;position:relative}
  /* Arriving through the door of the lab in the grass: the light of the doorway
     fades and the page settles, so going in reads as one move over two pages. */
  #lab-arrive{position:fixed;inset:0;z-index:95;pointer-events:none;
    background:radial-gradient(circle at 50% 62%, #fff6e0 0%, #f4e5c4 38%, #c9a978 100%);
    animation:lab-arrive .52s ease-out forwards}
  @keyframes lab-arrive{from{opacity:1}to{opacity:0}}
  html.arriving .wrap,html.arriving #gate{animation:lab-step-in .52s cubic-bezier(.2,.7,.3,1) both}
  @keyframes lab-step-in{from{transform:scale(1.06);opacity:.35}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion:reduce){
    #lab-arrive{display:none}
    html.arriving .wrap,html.arriving #gate{animation:none}
  }
  .wrap::before{content:'';position:absolute;top:0;bottom:0;left:22px;width:2px;background:var(--margin);opacity:.55}
  @media (max-width:400px){ .wrap{padding-left:34px} .wrap::before{left:15px} }
  h1,h2,h3{font-family:var(--round);font-weight:600;letter-spacing:-.01em;margin:0;line-height:1.2}
  h1{font-size:28px} h2{font-size:22px} h3{font-size:18px}
  .eyebrow{font-family:var(--round);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
  .muted{color:var(--mid);font-size:15px}
  a{color:var(--accent)}
  .top{display:flex;align-items:baseline;gap:14px;border-bottom:1px dashed var(--rule);padding-bottom:12px;margin-bottom:22px}
  .top a{margin-left:auto;font-size:14px;text-decoration:none;font-family:var(--round);font-weight:600}
  button{font-family:var(--round);font-weight:600;font-size:17px;padding:14px 20px;min-height:52px;border-radius:999px;border:0;
    cursor:pointer;margin-top:12px;width:100%;text-align:center;transition:transform .08s ease,box-shadow .16s}
  .primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--pen-dark)}
  .primary:active{transform:translateY(2px);box-shadow:0 1px 0 var(--pen-dark)}
  .secondary{background:var(--card);color:var(--ink);border:1.5px solid var(--rule)}
  .ghost{background:transparent;color:var(--accent);min-height:44px;font-size:15px}
  button:disabled{opacity:.5;cursor:default}
  .card{background:var(--surface);border-left:4px solid var(--hl);border-radius:0 12px 12px 0;padding:14px 18px;margin-top:16px;
    box-shadow:0 6px 18px rgba(29,42,68,.06)}
  .card.warn{border-left-color:var(--warn);background:var(--warn-bg)}
  .card.idea{border-left-color:var(--accent);background:var(--accent-bg)}
  .item{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:16px 18px;margin-top:12px;
    box-shadow:0 6px 18px rgba(29,42,68,.06)}
  .item.link{cursor:pointer}
  .item.link:hover{border-color:var(--mid)}
  .badge{display:inline-block;font-family:var(--round);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent);margin-left:8px;vertical-align:middle}
  .badge.soon{background:var(--surface);color:var(--mid)}
  .badge.kind{background:var(--hl-soft);color:var(--hl-ink)}
  html[data-theme="dark"] .badge.kind{color:var(--hl)}
  ul.need{margin:8px 0 0;padding-left:22px} ul.need li{margin:3px 0}
  .dgm{margin-top:16px;border:1.5px solid var(--rule);background:var(--card);padding:14px;border-radius:12px}
  .dgm svg{width:100%;height:auto;display:block}
  html[data-theme="dark"] .dgm svg{filter:invert(.92) hue-rotate(180deg)}
  .step{margin-top:14px;padding:14px 16px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card)}
  .step .n{font-family:var(--hand);font-weight:700;color:var(--accent);font-size:22px;line-height:1;margin-right:8px}
  .step.note{background:var(--surface);border-style:dashed}
  .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .opt{width:100%;text-align:left;margin:0;min-height:48px;padding:12px 16px;background:var(--card);color:var(--ink);
    border:1.5px solid var(--rule);border-radius:12px;font-family:var(--body);font-weight:400;font-size:16px}
  .step .q{font-size:19px;line-height:1.5;margin-top:2px}
  @keyframes rainbowSlide{from{background-position:0 0,0% 50%}to{background-position:0 0,300% 50%}}
  /* the chosen answer wears the Heat Lab's sliding rainbow ring */
  .opt.picked{border:2px solid transparent;font-weight:700;
    background:linear-gradient(var(--card),var(--card)) padding-box,
      linear-gradient(90deg,#e8493f,#ffb627,#3fc35f,#66ccff,#b557e6,#e8493f) border-box;
    background-size:100% 100%,300% 100%;animation:rainbowSlide 2.4s linear infinite;
    box-shadow:0 0 14px rgba(255,255,255,.18)}
  .opt.right{border-color:var(--accent);background:var(--accent-bg);font-weight:700}
  .opt.right.picked{background:linear-gradient(var(--accent-bg),var(--accent-bg)) padding-box,
      linear-gradient(90deg,#e8493f,#ffb627,#3fc35f,#66ccff,#b557e6,#e8493f) border-box;background-size:100% 100%,300% 100%}
  @media (prefers-reduced-motion:reduce){.opt.picked{animation:none}}
  /* read aloud: the segment being read wears the same rainbow ring */
  .step,.card{position:relative}
  button.say{position:absolute;top:10px;right:10px;width:36px;height:36px;min-height:0;padding:0;margin:0;border-radius:50%;
    border:1.5px solid var(--rule);background:var(--surface);color:var(--mid);font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  button.say:hover{color:var(--accent);border-color:var(--accent)}
  .has-say{padding-right:54px}
  .reading{--rb:var(--card);border:2px solid transparent !important;
    background:linear-gradient(var(--rb),var(--rb)) padding-box,
      linear-gradient(90deg,#e8493f,#ffb627,#3fc35f,#66ccff,#b557e6,#e8493f) border-box !important;
    background-size:100% 100%,300% 100% !important;animation:rainbowSlide 2.4s linear infinite;box-shadow:0 0 14px rgba(255,255,255,.18)}
  .step.note.reading{--rb:var(--surface)}
  .card.idea.reading{--rb:var(--accent-bg)}
  .card.warn.reading{--rb:var(--warn-bg)}
  .reading button.say{color:var(--accent);border-color:var(--accent)}
  button.readpart,button.readspeed{width:auto;min-height:38px;font-size:14px;padding:6px 14px;margin:0 8px 6px 0;display:inline-flex;gap:8px;align-items:center}
  .readrow{display:flex;flex-wrap:wrap;align-items:center}
  .w{border-radius:4px;transition:background .12s}
  .w.now{background:var(--hl-soft);box-shadow:0 0 0 3px var(--hl-soft);color:var(--hl-ink);font-weight:700}
  html[data-theme="dark"] .w.now{color:var(--hl-ink)}
  @media (prefers-reduced-motion:reduce){.reading{animation:none}}
  .opt:disabled{opacity:.85}
  .verdict{margin-top:10px;font-family:var(--round);font-weight:600;color:var(--accent)}
  textarea{width:100%;font-family:var(--round);font-weight:600;font-size:17px;line-height:1.6;padding:12px 14px;min-height:110px;margin-top:10px;
    background:var(--card);color:var(--ink);border:1.5px solid var(--rule);border-radius:10px}
  textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
  input.blank{font:inherit;font-family:var(--round);font-weight:600;width:130px;padding:4px 8px;margin:0 3px;border:0;border-bottom:2px solid var(--rule);
    background:transparent;color:var(--ink);text-align:center}
  input.blank:focus{outline:none;border-bottom-color:var(--accent)}
  input.blank.ok{border-bottom-color:var(--accent);color:var(--accent)} input.blank.no{border-bottom-color:var(--warn)}
  .row{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--rule)}
  .tick{width:14px;height:14px;flex:none;margin-top:7px;border-radius:50%;background:var(--accent)}
  .tick.open{background:transparent;position:relative}
  .tick.open::before,.tick.open::after{content:'';position:absolute;left:50%;top:50%;width:16px;height:3px;background:var(--margin);border-radius:2px;transform:translate(-50%,-50%) rotate(45deg)}
  .tick.open::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .dark{background:var(--ink);color:var(--bg);padding:16px 18px;margin-top:14px;border-radius:14px}
  html[data-theme="dark"] .dark{background:var(--card);color:var(--ink)}
  .dark .eyebrow{color:var(--hl)}
  .err{border-left:4px solid var(--warn);background:var(--warn-bg);padding:12px 16px;margin-top:12px;border-radius:0 10px 10px 0}
  .hide{display:none !important}
  /* the 3D lab opens full-screen over the steps, and comes back */
  #labwin{position:fixed;inset:0;z-index:65;background:#08131f;display:none;flex-direction:column}
  #labwin.on{display:flex}
  #labwin .bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:#0d1826;color:#eef1f7;font-family:var(--round);font-weight:600;font-size:15px}
  #labwin .bar button{width:auto;margin:0;min-height:38px;font-size:14px;padding:6px 14px;background:#1f8a4c;color:#fff}
  #labwin .bar a{margin-left:auto;color:#66ccff;font-size:13px}
  /* The way back is the way on: the bar says which part is being tested and
     carries a lit button that closes the bench and lands on "what did you see". */
  #labwin .bar{flex-wrap:wrap;row-gap:6px}
  #labwin .bar .guide{font-size:13px;color:#a9b8d1;font-weight:600;margin-left:6px}
  /* The way on sits at the bottom centre of every bench, this one and every one
     to come, because it belongs to the steps page and not to the bench. Quiet
     until the bench says the station is done; then it lights, grows and beckons. */
  #labwin-dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;pointer-events:none;width:max-content;max-width:94vw}
  #labwin-dock #labwin-done{pointer-events:auto;width:auto;margin:0;min-height:52px;padding:12px 26px;font-size:17px;border-radius:999px;
    background:rgba(18,33,58,.92);color:#5fd3ff;border:1.5px solid rgba(95,211,255,.55);backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 2px rgba(95,211,255,.12);transition:transform .3s,box-shadow .3s}
  #labwin-dock #labwin-done:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 22px rgba(95,211,255,.4)}
  #labwin-dock #labwin-done.lit{background:linear-gradient(90deg,#4fc47f,#7fe0a4);color:#06281a;border-color:transparent;font-size:19px;padding:14px 32px;min-height:58px;
    box-shadow:0 0 0 3px rgba(79,196,127,.35),0 0 34px rgba(79,196,127,.65),0 12px 30px rgba(0,0,0,.4);animation:dock-land .6s cubic-bezier(.3,1.5,.4,1) both,dock-beckon 1.6s ease-in-out .6s infinite}
  @keyframes dock-land{from{transform:translateY(40px) scale(.7);opacity:0}to{transform:none;opacity:1}}
  @keyframes dock-beckon{50%{box-shadow:0 0 0 9px rgba(79,196,127,.18),0 0 44px rgba(79,196,127,.85),0 12px 30px rgba(0,0,0,.4)}}
  #labwin-dock #labwin-done[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){ #labwin-dock #labwin-done.lit{animation:none} }
  @media (max-width:600px){ #labwin-dock{bottom:14px} #labwin-dock #labwin-done{font-size:15px;padding:11px 18px} #labwin-dock #labwin-done.lit{font-size:16px;padding:12px 22px} }
  #labwin-toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:2;max-width:min(92vw,560px);display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    padding:12px 16px;border-radius:14px;background:#12213a;color:#eef3fb;border:1px solid rgba(255,180,87,.5);box-shadow:0 12px 40px rgba(0,0,0,.5);font-family:var(--round);font-weight:600;font-size:15px;animation:box-in .4s both}
  #labwin-toast[hidden]{display:none}
  #labwin-toast button{width:auto;margin:0;min-height:40px;font-size:14px;padding:8px 14px;background:#ffb457;color:#3a2200}
  #labwin{position:fixed}
  #labwin iframe{flex:1;border:0;width:100%;background:#08131f}
  /* the celebration and the badges */
  #confetti{position:fixed;inset:0;z-index:80;pointer-events:none;display:none}
  .ach{margin-top:14px;padding:16px 18px;border-radius:14px;border:2px solid var(--hl);background:var(--hl-soft);display:flex;gap:14px;align-items:center}
  .ach .ico{font-size:34px;line-height:1}
  .ach b{font-family:var(--round);font-weight:700;font-size:18px;display:block}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .bdg{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--hl-soft);color:var(--hl-ink);font-family:var(--round);font-weight:600;font-size:14px}
  html[data-theme="dark"] .bdg{color:var(--hl)}
  .lockhint{font-size:13px;color:var(--mid);margin-top:6px}
  /* parts fold up, so the steps do not sprawl */
  .part-hd{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .part-hd h2{flex:1}
  .part-hd .chev{font-family:var(--round);color:var(--mid);transition:transform .2s}
  .part.open .part-hd .chev{transform:rotate(90deg)}
  .part-body{display:none}
  .part.open .part-body{display:block}
  .part-hd button{width:auto;margin:0;min-height:38px;font-size:14px;padding:6px 14px}
  button.mic{width:auto;min-height:40px;font-size:14px;padding:8px 14px;margin-top:8px;display:inline-flex;gap:8px;align-items:center}
  button.mic.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mic-hint{font-size:13px;line-height:1.5;margin-top:6px;color:var(--mid)}
  .busy{color:var(--mid);font-size:15px;margin-top:10px}
  /* members only */
  #gate{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;align-items:center;justify-content:center;padding:28px 22px;overflow:auto}
  #gate.on{display:flex} #gate .g-box{max-width:420px;width:100%}
  #gate input{width:100%;font-family:var(--body);font-size:17px;padding:14px 16px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink);margin-top:18px}
  .g-msg{margin-top:14px;font-size:15px;color:var(--mid)} .g-msg.err{color:var(--warn);border:0;background:none;padding:0}
  /* ── the console: inside the lab the lights are different ─────────────
     The list is the exercise book. An activity is an instrument panel: one
     screen at a time, a rail that shows where you are, a bench that opens the
     moment you have predicted. Deep navy rather than black, so it stays soft on
     a child's eyes; the app's green still means done and right; the safety
     strip is amber; the badge is gold. The same faces as the app, so it is
     still one product. */
  :root{
    --lab-bg:#0b1626; --lab-panel:#12213a; --lab-panel-2:#182c4a; --lab-line:rgba(120,190,255,.18);
    --lab-ink:#eef3fb; --lab-mid:#a9b8d1; --lab-faint:#6f7f9c;
    --glow:#5fd3ff; --glow-soft:rgba(95,211,255,.16);
    --lab-ok:#4fc47f; --lab-ok-soft:rgba(79,196,127,.16); --lab-ok-dark:#1e6b40;
    --lab-warn:#ffb457; --lab-warn-soft:rgba(255,180,87,.14);
    --lab-gold:#ffd84d; --lab-gold-soft:rgba(255,216,77,.14);
  }
  body.in-lab{overflow:hidden}
  #con-bg{position:fixed;inset:0;z-index:1;display:none;background:var(--lab-bg)}
  body.in-lab #con-bg{display:block}
  #act.console{position:fixed;inset:0;z-index:2;color:var(--lab-ink);display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:100%;overflow:hidden}
  #act.console > .busy,#act.console > .err,#act.console > .ghost{grid-column:1 / -1;align-self:start;margin:40px auto 0;max-width:520px;color:var(--lab-mid)}

  /* the rail: where you are in the mission */
  .rail{display:flex;flex-direction:column;gap:18px;padding:22px 18px;border-right:1px solid var(--lab-line);
    background:linear-gradient(180deg,rgba(18,33,58,.92),rgba(11,22,38,.72));backdrop-filter:blur(6px);overflow:auto;min-height:0}
  .rail .out{color:var(--glow);text-decoration:none;font-family:var(--round);font-weight:600;font-size:14px}
  .rail .mission .eyebrow{color:var(--glow);letter-spacing:.16em}
  .rail .mission b{display:block;font-family:var(--round);font-weight:600;font-size:18px;line-height:1.25;margin-top:4px;text-wrap:balance}
  .nodes{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;position:relative}
  .nodes::before{content:'';position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:var(--lab-line)}
  .node{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;color:var(--lab-mid);font-family:var(--round);font-weight:600;font-size:15px;
    position:relative;background:none;border:0;text-align:left;min-height:0;margin:0;width:100%;line-height:1.2}
  .node i{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:13px;
    border:2px solid var(--lab-line);background:var(--lab-bg);position:relative;z-index:1;transition:box-shadow .3s,border-color .3s,background .3s}
  .node.done i{border-color:var(--lab-ok);background:var(--lab-ok);color:#06281a}
  .node.now{color:var(--lab-ink)}
  .node.now i{border-color:var(--glow);color:var(--glow);box-shadow:0 0 0 4px var(--glow-soft),0 0 18px var(--glow);animation:node-pulse 2.2s ease-in-out infinite}
  .node.now.done i{color:#06281a}
  @keyframes node-pulse{50%{box-shadow:0 0 0 7px var(--glow-soft),0 0 26px var(--glow)}}
  .node small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--lab-faint);margin-top:1px}
  .node:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:8px}
  .rail-foot{margin-top:auto;padding:14px;border:1px solid var(--lab-line);border-radius:14px;display:flex;gap:12px;align-items:center;opacity:.6;transition:opacity .4s,box-shadow .4s}
  .rail-foot.got{opacity:1;border-color:var(--lab-gold);box-shadow:0 0 22px rgba(255,216,77,.25)}
  .rail-foot .ico{font-size:30px;line-height:1;filter:grayscale(1)} .rail-foot.got .ico{filter:none}
  .rail-foot .eyebrow{font-size:10px;color:var(--lab-faint)} .rail-foot.got .eyebrow{color:var(--lab-gold)}
  .rail-foot b{display:block;font-family:var(--round);font-weight:600;font-size:14px;line-height:1.25}

  /* the stage: one screen at a time */
  .stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;position:relative}
  .hud{display:flex;align-items:center;gap:16px;padding:16px 28px 0;max-width:820px;width:100%;margin:0 auto}
  .hud .counter{font-family:var(--round);font-weight:700;font-size:12px;letter-spacing:.16em;color:var(--glow);white-space:nowrap}
  .hud .bar{flex:1;height:4px;border-radius:2px;background:var(--lab-line);overflow:hidden}
  .hud .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--lab-ok),var(--glow));box-shadow:0 0 12px var(--glow);transition:width .5s cubic-bezier(.2,.7,.3,1)}

    const d = await api('/api/access', { action:'session' });
    gateLocked = !!d.locked;
    if (d.locked && d.ok) LSYNC.pull();
    if (d.locked && !d.ok) return gateOpen();
  } catch(e){ if (!sessionToken()) { /* server unreachable: let the list call say so */ } }
  $('gate').classList.remove('on');
  route();
}

/* ── the session record, same shape as the app's ── */
const LOG = {
  sid: null, q: Promise.resolve(), idleT: null, ended: false,
  on(){ return gateLocked && !!sessionToken(); },
  id(){ if (!this.sid){ try { this.sid = sessionStorage.getItem('sm-sid') || ''; } catch(e){}
    if (!this.sid){ this.sid = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2,'0')).join(''); try { sessionStorage.setItem('sm-sid', this.sid); } catch(e){} } } return this.sid; },
  event(type, data){ if (!this.on()) return; this.ended = false; this.touch();
    this.q = this.q.then(() => api('/api/log', { action:'event', sid: this.id(), ev:{ type, ...(data||{}) } })).catch(() => {}); },
  end(beacon){ if (!this.on() || this.ended || !this.sid) return; this.ended = true; clearTimeout(this.idleT);
    const body = JSON.stringify({ action:'end', sid: this.id(), session: sessionToken() });
    if (beacon && navigator.sendBeacon) navigator.sendBeacon('/api/log', new Blob([body], { type:'application/json' }));
    else this.q = this.q.then(() => api('/api/log', { action:'end', sid: this.id(), session: sessionToken() })).catch(() => {});
    this.sid = null; try { sessionStorage.removeItem('sm-sid'); } catch(e){} },
  touch(){ clearTimeout(this.idleT); this.idleT = setTimeout(() => this.end(false), 60*60*1000); },
};
['pointerdown','keydown'].forEach(ev => addEventListener(ev, () => { if (LOG.on() && !LOG.ended && LOG.sid) LOG.touch(); }, { passive:true }));
addEventListener('pagehide', () => LOG.end(true));

/* ── progress on this device ── */
const PK = 'sm-lab-progress-v1';
const prog = () => { try { return JSON.parse(localStorage.getItem(PK) || '{}'); } catch(e){ return {}; } };
const setProg = (id, key, val) => { const p = prog(); p[id] = p[id] || {}; p[id][key] = val; try { localStorage.setItem(PK, JSON.stringify(p)); } catch(e){} LSYNC.touch(); if (typeof conRefresh === 'function') conRefresh(); };
/* Progress and badges follow the pupil: while signed in, this key is kept on
   the account too and merged on arrival (a badge earned anywhere is earned). */
const LSYNC = {
  timer: null, dirty: false,
  on(){ return gateLocked && !!sessionToken(); },
  touch(){ if (!this.on()) return; this.dirty = true; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 2500); },
  async push(){ if (!this.on() || !this.dirty) return; this.dirty = false; try { await api('/api/access', { action: 'store-put', items: [{ key: PK, v: JSON.stringify(prog()), t: Date.now() }] }); } catch(e){ this.dirty = true; } },
  flush(){ if (!this.on() || !this.dirty) return; this.dirty = false; try { fetch('/api/access', { method: 'POST', keepalive: true, headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'store-put', items: [{ key: PK, v: JSON.stringify(prog()), t: Date.now() }], session: sessionToken() }) }); } catch(e){} },
  async pull(){
    if (!this.on()) return;
    try {
      const d = await api('/api/access', { action: 'store-get' });
      const r = d && d.store && d.store[PK]; if (!r || !r.v) { this.dirty = true; this.push(); return; }
      let R = {}; try { R = JSON.parse(r.v) || {}; } catch(e){ return; }
      const L = prog(), out = {};
      new Set([...Object.keys(L), ...Object.keys(R)]).forEach(id => {
        const x = L[id] || {}, y = R[id] || {}, o = { ...y, ...x };
        if (y.badge && !x.badge) o.badge = y.badge;
        if (x.badge && y.badge) o.badge = ((x.badge.ts || 0) <= (y.badge.ts || 0)) ? x.badge : y.badge;
        ['tested', 'done', 'cdone'].forEach(f => { if (x[f] || y[f]) o[f] = x[f] || y[f]; });
        out[id] = o;
      });
      const merged = JSON.stringify(out);
      if (merged !== JSON.stringify(L)) { try { localStorage.setItem(PK, merged); } catch(e){} if (A) renderActivity(A); else if (!$('list').classList.contains('hide')) renderList(); }
      if (merged !== r.v) { this.dirty = true; this.push(); }
    } catch(e){ /* the device copy stands */ }
  },
};
addEventListener('pagehide', () => LSYNC.flush());
const getProg = (id, key) => ((prog()[id] || {})[key]);

// Admin mode (logged in from the app's buddy menu, or here) counts too: the site
// owner testing the app sees everything and no bench is locked.
const ADMIN_ON = 'sm-admin-v1';
const ADMIN_FP = '6a93db1e49bd29e2f2c8e4c5a5a79c4ede9723cc0c5a296e2bd221e77aa8886d';
const isSiteAdmin = () => { try { return localStorage.getItem(ADMIN_ON) === '1'; } catch(e){ return false; } };

// The admin can also log in here, so an activity still in review can be checked
// on this page directly. Only a fingerprint of the password lives in the page.
async function codeHash(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('sm:' + t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,'0')).join('');
}

  if (isSiteAdmin()) return '<div class="muted" style="margin-top:34px;font-size:13px">Admin mode is on for this device: activities in review are shown and every bench is open. <a href="#" id="rev-off">Admin logout</a></div>';
  if (adminDevice()) return '<div class="muted" style="margin-top:34px;font-size:13px">Adult mode is on for this tab: activities in review are shown and every bench is open.</div>';
  return '<div style="margin-top:34px;display:flex;gap:8px;align-items:center;flex-wrap:wrap" class="muted"><span style="font-size:13px">Admin?</span>' +

function wireReviewer(){

/* ── the console ─────────────────────────────────────────────────
   An activity is a run of screens, one at a time: the briefing, then each part
   (its heading, then every step of it), the conclusion, the real-life
   questions, and the badge at the end. A rail down the side shows the run and
   where you are. Nothing is thrown at the pupil at once; the next thing
   appears only when they ask for it, and a question has to be answered before
   the way forward opens. The bench still opens the moment a prediction is made.
   Every element keeps the id and data attribute the rest of this page already
   looks for, so marking, picks, the locks and the badge work unchanged. */
const CON = { a: null, scr: [], groups: [], i: 0 };
const SCR_KEY = id => 'sm-lab-scr:' + id;

function renderActivity(a){
  CON.a = a; CON.scr = []; CON.groups = []; CON.i = 0;
  const scr = CON.scr, groups = CON.groups;
  const covered = pid => !!(a.sim && a.sim.page && (a.sim.covers || []).indexOf(pid) >= 0);
  const label = (a.sim && a.sim.label) || "Let's test it now!";

  // the briefing
  groups.push({ id: 'brief', mark: 'i', name: 'Briefing' });
  scr.push({ id: 'brief', group: 'brief', kind: 'brief', html:
    '<span class="eyebrow">' + esc(a.chapter) + ' · ' + esc(a.code) + (a.minutes ? ' · about ' + a.minutes + ' minutes' : '') + '</span>' +
    '<h1>' + esc(a.title) + '</h1><div class="tags">' + tags(a).replace(/margin-left:8px/g, '') + '</div>' +
    '<div class="card idea"><span class="eyebrow hd" data-ico="💡">The big idea</span><div class="big">' + esc(a.bigIdea) + '</div></div>' +
    '<div class="card"><span class="eyebrow hd" data-ico="🔭">What we are finding out</span><div style="margin-top:6px">' + esc(a.aim) + '</div></div>' +
    (a.safety && a.safety.length ? '<div class="card warn"><span class="eyebrow hd" data-ico="⚠️">Stay safe</span>' + a.safety.map(s => '<div style="margin-top:6px">' + esc(s) + '</div>').join('') + '</div>' : '') +
    (a.sim && a.sim.page ? '<div class="how"><span class="dot"></span><div>Predict first. The moment you make a prediction, <b>' + esc(label) + '</b> lights up and the 3D bench opens for that part.</div></div>' : '') });

  // the parts, a screen per step
  (a.parts || []).forEach(p => {
    const P = p.id.toUpperCase();
    groups.push({ id: p.id, mark: P, name: 'Part ' + P });
    scr.push({ id: 'part-' + p.id, group: p.id, kind: 'part', html:
      '<span class="eyebrow">Part ' + P + ' · ' + esc(p.who) + '</span><h2>' + esc(p.title) + '</h2>' +
      (p.need ? '<div class="card"><span class="eyebrow hd" data-ico="🧰">What you need</span><ul class="need">' + p.need.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul></div>' : '') +
      (p.diagram ? svgFor(p.diagram) : '') });
    const steps = p.steps || [];
    let n = 0, carry = '';
    steps.forEach((s, si) => {
      const key = p.id + ':' + si, isQ = s.predict || s.observe || s.explain;
      // a thing worth knowing sits under the step before it
      if (s.note){
        const h = '<div class="step note"><span class="eyebrow hd" data-ico="✨">Worth knowing</span><div style="margin-top:4px">' + esc(s.note) + '</div></div>';
        const last = scr[scr.length - 1];
        if (last && last.group === p.id && last.kind !== 'part') last.html += h;
        else scr.push({ id: 'n-' + cssKey(key), group: p.id, kind: 'note', html: h });
        return;
      }
      // an instruction on its own leads into the question that follows it
      if (!isQ){
        const nxt = steps[si + 1];
        if (s.do && nxt && (nxt.predict || nxt.observe || nxt.explain)){ carry = s.do; return; }
        if (s.do) scr.push({ id: 's-' + cssKey(key), group: p.id, kind: 'do', html:
          '<span class="eyebrow">Part ' + P + ' · do this</span><div class="step"><span class="eyebrow hd" data-ico="🧪">Do this</span><div class="q">' + esc(s.do) + '</div></div>' });
        return;
      }
      n++;
      const doTxt = [carry, s.do].filter(Boolean).join(' '); carry = '';
      let h = '<span class="eyebrow">Part ' + P + ' · step ' + n + '</span><div class="step" data-key="' + key + '">';
      if (doTxt) h += '<div class="do">' + esc(doTxt) + '</div>';
      if (s.predict || s.observe){
        const t = s.predict || s.observe, kind = s.predict ? 'predict' : 'observe';
        const benchHere = s.predict && covered(p.id);   // a prediction made is a prediction to test
        h += '<span class="eyebrow hd" data-ico="' + (s.predict ? '🔮' : '👀') + '">' + (s.predict ? 'Predict' : 'What did you see?') + '</span><div class="q">' + esc(t.q) + '</div>' +
          '<div class="opts">' + t.options.map((o, i) => '<button class="opt" data-pick="' + key + '" data-i="' + i + '" data-kind="' + kind + '">' + esc(o) + '</button>').join('') + '</div>' +
          '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="verdict" id="v-' + cssKey(key) + '" style="flex:1"></div>' +
          (benchHere ? '<button class="primary" data-lab data-step="' + key + '" type="button" style="width:auto;margin-top:10px" hidden>' + esc(label) + '</button>' : '') + '</div>' +
          (benchHere ? '<div class="benchhint muted" hidden>On the bench, watch what happens. Then come back here and the next screen asks what you saw.</div>' : '');
      }
      if (s.explain) h += explainHtml(key, s.explain.q, s.explain.marks, { part: p.id, step: si }, getProg(a.id, key) === 'done');
      h += '</div>';
      scr.push({ id: 's-' + cssKey(key), group: p.id, kind: s.explain ? 'explain' : 'pick', key, html: h });
    });
  });

  // the conclusion
  if (a.conclude && a.conclude.length){
    groups.push({ id: 'conclude', mark: '✎', name: "Let's conclude" });
    let h = '<span class="eyebrow">Let\'s conclude</span><h2>Fill in the missing words.</h2>';
    a.conclude.forEach((c, ci) => {
      let k = 0;
      h += '<div class="step" style="font-size:17px">' + c.text.split('___').map((seg, i, arr) => esc(seg) + (i < arr.length - 1 ? '<input class="blank" data-c="' + ci + '" data-k="' + (k++) + '" autocomplete="off" autocapitalize="off">' : '')).join('') + '</div>';
    });
    h += '<button class="primary" id="c-check" style="margin-top:16px">Check my words</button><div id="c-out"></div>';
    scr.push({ id: 'conclude', group: 'conclude', kind: 'conclude', html: h });
  }

  // real life, one question a screen
  if (a.check && a.check.length){
    groups.push({ id: 'check', mark: '?', name: 'Now use it' });
    a.check.forEach((c, ci) => scr.push({ id: 'check-' + ci, group: 'check', kind: 'explain', key: 'check:' + ci, html:
      '<span class="eyebrow">Now use it · ' + (ci + 1) + ' of ' + a.check.length + '</span>' +
      '<div class="step" data-key="check:' + ci + '">' + explainHtml('check:' + ci, c.q, c.marks, { check: ci }, getProg(a.id, 'check:' + ci) === 'done') + '</div>' }));
  }

  // the end
  groups.push({ id: 'badge', mark: '★', name: 'The badge' });
  scr.push({ id: 'badge', group: 'badge', kind: 'badge', html:
    '<span class="eyebrow">The end of the lab</span><h2 id="end-h"></h2><div id="ach"></div><div id="todo"></div>' +
    '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center">' +
    '<button class="secondary" id="done-btn" style="width:auto;margin:0">← All experiments</button>' +
    '<button class="ghost" data-reset id="reset-top" type="button" disabled style="width:auto;margin:0">↺ Start this experiment again</button></div>' +
    '<div class="muted" data-resethint style="font-size:13.5px;margin-top:6px"></div>' });

  const foot = a.badge ? '<div class="rail-foot" id="rail-badge"><span class="ico">' + a.badge.icon + '</span><div><span class="eyebrow">Badge to earn</span><b>' + esc(a.badge.name) + '</b></div></div>' : '';
  $('act').className = 'console';
  $('act').innerHTML =
    '<aside class="rail"><a class="out" href="#">← All experiments</a>' +
    '<div class="mission"><span class="eyebrow">' + esc(a.chapter) + ' · ' + esc(a.code) + '</span><b>' + esc(a.title) + '</b></div>' +
    '<ol class="nodes"><span class="bead"></span>' + groups.map(g => '<li><button class="node" type="button" data-group="' + g.id + '"><i>' + g.mark + '</i><span class="lbl">' + esc(g.name) + '<small></small></span></button></li>').join('') + '</ol>' + foot + '</aside>' +
    '<section class="stage"><div class="hud"><span class="counter" id="con-count"></span><div class="bar"><i id="con-bar"></i></div><span class="pct" id="con-pct"></span></div>' +
    '<div class="screens" id="con-screens">' + scr.map(s => '<div class="scr" data-scr="' + s.id + '">' + s.html + '</div>').join('') + '</div>' +
    '<div class="ctl"><button class="back" id="con-back" type="button">← Back</button><span class="msg" id="con-msg"></span>' +
    '<button class="ghost skip" id="con-skip" type="button" hidden>Skip for now →</button><button class="next" id="con-next" type="button">Next →</button></div></section>';
  document.body.classList.add('in-lab'); CONBG.start();
  // boxes and their plates arrive one after another, in the order they sit
  $('act').querySelectorAll('.scr').forEach(sc => sc.querySelectorAll('.card, .step').forEach((el, n) => {
    el.style.setProperty('--n', n); el.querySelectorAll('.hd').forEach(h => h.style.setProperty('--n', n));
  }));
  wireActivity(a); addReaders(a); refreshGates(a);
  $('con-back').onclick = () => conShow(CON.i - 1, 'back');
  $('con-next').onclick = () => { if (!$('con-next').disabled) conShow(CON.i + 1); };
  $('con-skip').onclick = () => conShow(CON.i + 1);
  $('act').querySelectorAll('.node').forEach(b => b.onclick = () => conShow(scr.findIndex(s => s.group === b.dataset.group)));
  conShow(conResume(a));
}
const cssKey = k => k.replace(/[^a-z0-9]/gi, '_');

// A screen is satisfied when what it asks for has been done.
const isTask = s => s.kind === 'pick' || s.kind === 'explain' || s.kind === 'conclude';
function satisfied(s){
  const a = CON.a;
  if (s.kind === 'pick') return getProg(a.id, s.key) != null;
  if (s.kind === 'explain') return getProg(a.id, s.key) === 'done';
  if (s.kind === 'conclude') return !!getProg(a.id, 'cdone');
  return true;
}
// Where to open: a fresh activity starts at the briefing; one in progress comes
// back to the screen it was on, or failing that to the first thing still to do.
function conResume(a){
  const p = prog()[a.id] || {};
  const touched = Object.keys(p).some(k => k !== 'tested' && k !== 'badge');
  if (!touched) return 0;
  let saved = -1; try { saved = +sessionStorage.getItem(SCR_KEY(a.id)); } catch(e){}
  if (saved >= 0 && saved < CON.scr.length) return saved;
  const first = CON.scr.findIndex(s => isTask(s) && !satisfied(s));
  return first >= 0 ? first : CON.scr.length - 1;
}
function conShow(i, dir){
  const scr = CON.scr; if (!scr.length || !$('con-screens')) return;
  i = Math.max(0, Math.min(scr.length - 1, i)); CON.i = i;
  ttsStop();
  [...$('con-screens').children].forEach((el, k) => {
    el.classList.remove('on', 'back');
    if (k === i){ el.classList.add('on'); if (dir === 'back') el.classList.add('back'); }
  });
  $('con-screens').scrollTop = 0;
  try { sessionStorage.setItem(SCR_KEY(CON.a.id), String(i)); } catch(e){}
  if (scr[i].kind === 'badge') conEnd();
  conRefresh();
}
// The rail, the bar and the buttons follow the progress record, so they are
// right after every pick, every marked answer and every reset.
function conRefresh(){
  const a = CON.a, scr = CON.scr;
  if (!a || !scr.length || !$('con-next')) return;
  const i = CON.i, s = scr[i], last = i === scr.length - 1;
  const tasks = scr.filter(isTask), done = tasks.filter(satisfied).length;
  $('con-count').textContent = 'Screen ' + (i + 1) + ' of ' + scr.length;
  $('con-bar').style.width = (tasks.length ? Math.round(done / tasks.length * 100) : 0) + '%';
  $('con-pct').textContent = done + ' of ' + tasks.length + ' done';
  // the rail
  CON.groups.forEach(g => {
    const b = $('act').querySelector('.node[data-group="' + g.id + '"]'); if (!b) return;
    const mine = scr.filter(x => x.group === g.id), tk = mine.filter(isTask);
    const lastIdx = scr.lastIndexOf(mine[mine.length - 1]);
    const isDone = g.id === 'badge' ? !!getProg(a.id, 'badge') : tk.length ? tk.every(satisfied) : lastIdx < i;
    b.classList.toggle('done', isDone); b.classList.toggle('now', s.group === g.id);
    const sm = b.querySelector('small'); if (sm) sm.textContent = tk.length ? tk.filter(satisfied).length + ' of ' + tk.length + ' done' : '';
    b.setAttribute('aria-current', s.group === g.id ? 'step' : 'false');
  });
  const rb = $('rail-badge'); if (rb) rb.classList.toggle('got', !!getProg(a.id, 'badge'));
  $('act').querySelectorAll('[data-lab]').forEach(b => { const h = b.parentElement.nextElementSibling; if (h && h.classList.contains('benchhint')) h.hidden = b.hidden; });
  // the line down the rail fills with light as far as the screen you are on
  const nodes = $('act').querySelector('.nodes'), now = nodes && nodes.querySelector('.node.now');
  if (nodes && now){ const ni = now.querySelector('i'); nodes.style.setProperty('--fill', (now.offsetTop + ni.offsetTop + ni.offsetHeight / 2 - 16) + 'px'); }
  // the way forward
  const ok = satisfied(s), next = $('con-next'), skip = $('con-skip'), msg = $('con-msg');
  $('con-back').hidden = i === 0;
  next.hidden = last; skip.hidden = true; msg.textContent = '';
  next.classList.toggle('finish', i === scr.length - 2);
  next.textContent = i === scr.length - 2 ? 'Finish ★' : 'Next →';
  if (!last && !ok){
    next.disabled = true;
    if (s.kind === 'pick') msg.textContent = 'Choose an answer to go on.';
    else if (s.kind === 'conclude'){ msg.textContent = 'Check your words, or come back to this later.'; skip.hidden = false; }
    else { msg.textContent = 'Check your answer, or come back to it later.'; skip.hidden = false; }
  } else next.disabled = false;
}
// The last screen: the badge if it is earned, otherwise what is left to do,

function conEnd(){
  const a = CON.a, h = $('end-h'), todo = $('todo'); if (!h) return;

  if (got){ h.textContent = 'You did it.'; todo.innerHTML = ''; if ($('ach') && !$('ach').innerHTML && a.badge) $('ach').innerHTML = achHtml(a); return; }
  h.textContent = left.length ? (left.length === 1 ? 'One thing left.' : left.length + ' things left.') : 'Nearly there.';
  todo.innerHTML = '<div class="muted" style="margin-top:8px">' + (a.badge ? 'The badge <b>' + esc(a.badge.name) + '</b> is yours when every step is done.' : 'Finish every step to complete the lab.') + '</div>' +
    '<div class="todo">' + left.map(x => {
      const g = CON.groups.find(g => g.id === x.s.group), k = g ? g.name : x.s.group;
      const what = x.s.kind === 'pick' ? 'A question to answer' : x.s.kind === 'conclude' ? 'The missing words' : 'An explanation to check';
      return '<button type="button" data-goto="' + x.i + '"><span class="k">' + esc(k) + '</span><span>' + what + '</span></button>';
    }).join('') + '</div>';

}
function conLeave(){

// Arrow keys move between screens when nothing is being typed.
document.addEventListener('keydown', e => {

  const t = e.target; if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;

/* Behind the console: a faint grid, a glow from the far corner, and slow motes
   drifting up like dust in a beam. Still under "reduce motion", and asleep
   whenever the tab is hidden. */
const CONBG = {
  c: null, ctx: null, dots: [], raf: 0, on: false, W: 0, H: 0,
  start(){
    if (!this.c){
      this.c = document.createElement('canvas'); this.c.id = 'con-bg'; this.c.setAttribute('aria-hidden', 'true');
      document.body.insertBefore(this.c, document.body.firstChild); this.ctx = this.c.getContext('2d');
      addEventListener('resize', () => { if (this.on) this.size(); });
      document.addEventListener('visibilitychange', () => { if (!document.hidden && this.on && !this.raf) this.raf = requestAnimationFrame(t => this.frame(t)); });
    }
    this.on = true; this.size();
  },
  stop(){ this.on = false; if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0; },
  size(){
    const d = Math.min(2, devicePixelRatio || 1); this.W = innerWidth; this.H = innerHeight;
    this.c.width = this.W * d; this.c.height = this.H * d; this.ctx.setTransform(d, 0, 0, d, 0, 0);
    this.dots = []; for (let i = 0; i < 70; i++) this.dots.push({ x: Math.random() * this.W, y: Math.random() * this.H, r: Math.random() * 1.6 + .5, v: Math.random() * 9 + 3, p: Math.random() * 6.28 });
    if (this.raf) cancelAnimationFrame(this.raf); this.raf = 0;
    this.frame(performance.now(), true);
  },
  frame(t, once){
    if (!this.on && !once){ this.raf = 0; return; }
    const ctx = this.ctx, W = this.W, H = this.H, still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(95,211,255,.07)'; ctx.lineWidth = 1;
    for (let x = 0.5; x <= W; x += 48){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0.5; y <= H; y += 48){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    const g = ctx.createRadialGradient(W * .88, -H * .12, 10, W * .88, -H * .12, H * .95);
    g.addColorStop(0, 'rgba(95,211,255,.20)'); g.addColorStop(1, 'rgba(95,211,255,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const g2 = ctx.createRadialGradient(0, H, 10, 0, H, H * .7);
    g2.addColorStop(0, 'rgba(79,196,127,.10)'); g2.addColorStop(1, 'rgba(79,196,127,0)');
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    this.dots.forEach(d => {
      if (!still){ d.y -= d.v * 0.016; if (d.y < -4){ d.y = H + 4; d.x = Math.random() * W; } }
      const a = .32 + .28 * Math.sin(t / 900 + d.p);
      ctx.fillStyle = 'rgba(160,225,255,' + a.toFixed(2) + ')';
      ctx.beginPath(); ctx.arc(d.x + (still ? 0 : Math.sin(t / 1400 + d.p) * 6), d.y, d.r, 0, 6.283); ctx.fill();
    });
    if (this.on && !still && !document.hidden) this.raf = requestAnimationFrame(tt => this.frame(tt)); else this.raf = 0;
  }
};

function explainHtml(key, q, marks, where, done){

    (done ? '<div class="verdict">✓ Marked. Your explanation has been checked.</div>' :
    '<div id="x-' + id + '" data-where=\'' + esc(JSON.stringify(where)) + '\'>' +
    '<textarea id="t-' + id + '" maxlength="800" placeholder="Write your explanation in full sentences…"></textarea>' +
    '<div class="muted enterhint">Enter sends it. Shift + Enter for a new line.</div>' +

/* ── locks, completion and the badge ───────────────────────
   Predict before you test: a part's bench opens only once every prediction in
   it is made. Finish every step, the conclusion and the checks, and the whole
   lab unlocks with a badge — that is the achievement. */
// A part's bench opens with its first prediction: predict, then test, then the next prediction.
const predsDone = (a, p) => (p.steps || []).some((s, i) => s.predict && getProg(a.id, p.id + ':' + i) != null);
const partDone = (a, p) => (p.steps || []).every((s, i) => { const k = p.id + ':' + i;
  if (s.predict || s.observe) return getProg(a.id, k) != null; if (s.explain) return getProg(a.id, k) === 'done'; return true; });
const allDone = a => (a.parts || []).every(p => partDone(a, p)) && (!(a.conclude || []).length || !!getProg(a.id, 'cdone')) &&
  (a.check || []).every((c, i) => getProg(a.id, 'check:' + i) === 'done');
// Where a part's bench is: usually a step in the activity's own lab page, but a
// part may borrow a station from another lab (map: { c: { page, step } }).
const simFor = (a, pid) => { const m = a.sim && a.sim.map && a.sim.map[pid]; if (!m) return null; return typeof m === 'string' ? { page: a.sim.page, step: m } : m; };
function unlockList(a, page){
  if (getProg(a.id, 'badge') || adminDevice()) return 'all';
  page = page || a.sim.page;
  const ids = ['intro'];
  (a.sim.covers || []).forEach(pid => { const p = (a.parts || []).find(x => x.id === pid), m = simFor(a, pid); if (p && m && m.page === page && predsDone(a, p)) ids.push(m.step); });
  return ids.join(',');
}
function refreshGates(a){
  if (!a.sim || !a.sim.page) return;
  const got = !!getProg(a.id, 'badge'), adm = adminDevice();
  let anyOpen = got || adm;
  // The button beside each prediction appears the moment that prediction is made.
  $('act').querySelectorAll('[data-lab][data-step]').forEach(b => {
    const made = getProg(a.id, b.dataset.step) != null;
    b.hidden = !(made || got || adm); if (made) anyOpen = true;
    const hh = b.parentElement.nextElementSibling; if (hh && hh.classList.contains('benchhint')) hh.hidden = b.hidden;
  });
  (a.parts || []).forEach(p => { if (predsDone(a, p)) anyOpen = true; });
  const tested = !!getProg(a.id, 'tested');
  const rt = $('reset-top'); if (rt) rt.disabled = !(tested || adm);
  const rh = $('act').querySelector('[data-resethint]'); if (rh) rh.textContent = (tested || adm) ? 'Clears your answers here. A badge you earned stays.' : 'Available after you test your first prediction.';
  const hint = $('act').querySelector('[data-lockhint]');
  if (hint) hint.textContent = got ? a.badge ? a.badge.icon + ' Badge earned — the whole lab is open, including the challenge.' : 'The whole lab is open.'
    : adm ? 'Admin mode: the whole bench is open.'
    : anyOpen ? 'Open so far: ' + (a.sim.covers || []).filter(pid => { const p = (a.parts || []).find(x => x.id === pid); return p && predsDone(a, p); }).map(pid => 'Part ' + pid.toUpperCase()).join(', ') + '. Everything opens with the badge.'
    : 'Nothing is open yet. Make your first prediction below.';
  if (got && $('ach') && !$('ach').innerHTML && a.badge) $('ach').innerHTML = achHtml(a);
}
const achHtml = a => '<div class="ach"><div class="ico">' + a.badge.icon + '</div><div><span class="eyebrow" style="color:var(--hl-ink)">Achievement unlocked</span><b>' + esc(a.badge.name) + '</b>' +
  '<div style="font-size:15px">' + esc(a.badge.line) + ' The whole 3D lab is now open — challenge included.</div></div></div>';
function checkAchievement(a){
  if (getProg(a.id, 'badge') || !allDone(a)) return;
  setProg(a.id, 'badge', { ts: Date.now(), icon: a.badge ? a.badge.icon : '🏅', name: a.badge ? a.badge.name : a.title, code: a.code }); setProg(a.id, 'done', true);
  if ($('ach') && a.badge) $('ach').innerHTML = achHtml(a);
  refreshGates(a); celebrate();
  conShow(CON.scr.length - 1);
  LOG.event('lab', { code: a.code, what: 'achievement unlocked', badge: a.badge ? a.badge.name : a.title });
}

/* ── rainbow confetti and a success sound ── */
function celebrate(){
  try { successSound(); } catch(e){}
  const c = $('confetti'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
  const cols = ['#ff5252','#ff9800','#ffd600','#4caf50','#00bcd4','#7c4dff'];
  const P = Array.from({ length: 180 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3,
    r: 5 + Math.random() * 6, a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, col: cols[Math.floor(Math.random() * cols.length)] }));
  const t0 = performance.now();
  (function tick(now){
    const t = (now - t0) / 1000; g.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.a += p.va;
      g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.col; g.globalAlpha = Math.max(0, Math.min(1, 4 - t)); g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
    if (t < 4) requestAnimationFrame(tick); else { g.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
  })(t0);
}
let actx = null;
function successSound(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
  const t0 = actx.currentTime + .02;
  [[523.25, 0], [659.25, .13], [783.99, .26], [1046.5, .39]].forEach(([f, dt]) => {
    const o = actx.createOscillator(), gn = actx.createGain(); o.type = 'triangle'; o.frequency.value = f;
    gn.gain.setValueAtTime(0, t0 + dt); gn.gain.linearRampToValueAtTime(.09, t0 + dt + .02); gn.gain.exponentialRampToValueAtTime(.0001, t0 + dt + (dt > .3 ? .7 : .22));
    o.connect(gn).connect(actx.destination); o.start(t0 + dt); o.stop(t0 + dt + .8);
  });
}

/* ── the 3D lab, full-screen over the steps ───────────────
   Each 3D lab is its own page under labs/<name>/, laid out like the Heat Lab.
   "Let's test it now!" opens it over the steps; "Back to the steps" closes it
   and everything the pupil had ticked is still there. */
function openLab(a, pid){
  ttsStop();
  const m = pid ? simFor(a, pid) : null, page = (m && m.page) || a.sim.page;
  const url = page + '?unlock=' + encodeURIComponent(unlockList(a, page));
  $('labwin-frame').src = url; $('labwin-title').textContent = a.title; $('labwin-tab').href = url;
  $('labwin').classList.add('on'); document.body.style.overflow = 'hidden';
  CON.bench = pid || null; labGuide(a, pid);
  if (!getProg(a.id, 'tested')){ setProg(a.id, 'tested', true); refreshGates(a); }
  LOG.event('lab', { code: a.code, what: 'opened the 3D lab' });
}
function closeLab(){
  if (!$('labwin').classList.contains('on')) return;
  $('labwin').classList.remove('on'); $('labwin-frame').src = 'about:blank'; document.body.style.overflow = '';
  $('labwin-toast').hidden = true;
  conReturn();
}
// Which part the bench is open for, said plainly in the bar, with the way on lit.
function labGuide(a, pid){
  const g = $('labwin-guide'), d = $('labwin-done');
  if (!pid){ g.textContent = ''; d.hidden = true; return; }
  g.textContent = 'Testing Part ' + pid.toUpperCase() + '.';
  d.hidden = false; d.classList.remove('lit'); d.textContent = 'Finished on the bench? Say what I saw →';
}
$('labwin-done').onclick = () => { LOG.event('lab', { code: CON.a ? CON.a.code : '', what: 'back from the bench by the lit button' }); closeLab(); };
// Back from the bench: land on the first thing in that part still to do,
// which straight after a prediction is "what did you see".
function conReturn(){
  const a = CON.a, pid = CON.bench; CON.bench = null;
  if (!a || !pid || !CON.scr.length) return;
  const i = CON.scr.findIndex(x => x.group === pid && isTask(x) && !satisfied(x));
  if (i >= 0 && i !== CON.i) conShow(i);
}
/* A bench can talk to the steps. Two messages, both optional:
     parent.postMessage({ type: 'lab:done', step: 'plan' }, '*')    the station is finished
     parent.postMessage({ type: 'lab:locked', step: 'run' }, '*')   a locked pill was tapped
   Done lights the button in the bar green. Locked shows, over the bench, which
   prediction opens that station and a button that goes straight to it. */
addEventListener('message', e => {
  const d = e.data || {}; const a = CON.a;
  if (!a || !$('labwin').classList.contains('on') || typeof d.type !== 'string') return;
  if (d.type === 'lab:done'){
    const b = $('labwin-done'); b.hidden = false; b.classList.add('lit'); b.textContent = 'Station done ✓  Say what I saw →';
    $('labwin-guide').textContent = 'Testing Part ' + (CON.bench || '').toUpperCase() + '. Done!';
  }
  if (d.type === 'lab:locked'){
    const pid = (a.sim && a.sim.covers || []).find(p => { const m = simFor(a, p); return m && m.step === d.step; });
    const t = $('labwin-toast'); if (!pid) return;
    t.querySelector('.t-txt').textContent = '🔒 That station opens after your Part ' + pid.toUpperCase() + ' prediction.';
    const go = $('labwin-go'); go.textContent = 'Go and predict →';
    go.onclick = () => { CON.bench = null; closeLab(); const i = CON.scr.findIndex(x => x.group === pid && x.kind === 'pick' && !satisfied(x)); if (i >= 0) conShow(i); };
    t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => { t.hidden = true; }, 8000);
  }

$('labwin-back').onclick = closeLab;

function wireActivity(a){
  $('act').querySelectorAll('[data-lab]').forEach(b => b.onclick = e => { e.stopPropagation(); if (!b.disabled) openLab(a, (b.dataset.step || '').split(':')[0]); });
  // parts fold: tap a heading to open it and fold the others
  $('act').querySelectorAll('.part-hd').forEach(hd => hd.onclick = () => {
    const part = hd.parentElement, wasOpen = part.classList.contains('open');
    $('act').querySelectorAll('.part').forEach(p => p.classList.remove('open'));
    if (!wasOpen){ part.classList.add('open'); part.scrollIntoView({ behavior:'smooth', block:'start' }); }
  });
  // predictions and observations
  $('act').querySelectorAll('[data-pick]').forEach(b => {
    const key = b.dataset.pick, saved = getProg(a.id, key);
    if (saved != null) showPick(a, key, +saved, false);
    b.onclick = () => { setProg(a.id, key, +b.dataset.i); showPick(a, key, +b.dataset.i, true); };
  });
  // written explanations
  $('act').querySelectorAll('[data-mark]').forEach(b => b.onclick = () => markExplain(a, b.dataset.mark));
  $('act').querySelectorAll('textarea').forEach(t => attachMic(t));
  // Enter sends the answer, the way it does in a chat; Shift+Enter makes a new line.
  $('act').querySelectorAll('textarea[id^="t-"]').forEach(t => t.onkeydown = e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const b = t.parentElement.querySelector('[data-mark]'); if (b && !b.disabled && t.value.trim()) b.click();
  });
  // and in the missing-words boxes, Enter checks the words
  $('act').querySelectorAll('input.blank').forEach(inp => inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); const c = $('c-check'); if (c) c.click(); } });
  // conclude
  const cc = $('c-check');
  if (cc) cc.onclick = () => {
    let right = 0, total = 0, tries = (getProg(a.id, 'ctries') || 0) + 1; setProg(a.id, 'ctries', tries);
    const filled = [];
    $('act').querySelectorAll('input.blank').forEach(inp => {
      const want = a.conclude[+inp.dataset.c].answers[+inp.dataset.k]; total++;
      const got = inp.value.trim().toLowerCase();
      const ok = got && (got === want || got.startsWith(want.slice(0, Math.min(5, want.length))));
      inp.classList.toggle('ok', !!ok); inp.classList.toggle('no', !ok);
      if (ok) right++; else if (tries >= 2) inp.value = want, inp.classList.add('ok');
      filled.push(inp.value);
    });
    $('c-out').innerHTML = '<div class="verdict">' + (right === total ? 'All ' + total + ' right.' : right + ' of ' + total + ' right.' + (tries >= 2 ? ' The missing words are filled in for you.' : ' Try the amber ones again.')) + '</div>';
    LOG.event('lab', { code: a.code, what: 'conclusion', words: filled.join(' | '), right, total });
    if (right === total || tries >= 2) { setProg(a.id, 'cdone', true); checkAchievement(a); }
  };
  const db = $('done-btn'); if (db) db.onclick = () => { location.hash = ''; };
  // Redo from the top. Progress for this activity is cleared; an earned badge is kept.
  $('act').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
    if (b.disabled) return;
    if (!confirm('Start "' + a.title + '" again from the beginning? Your predictions, observations and answers here will be cleared.')) return;
    const p = prog(); const badge = (p[a.id] || {}).badge;
    p[a.id] = badge ? { badge } : {};
    try { localStorage.setItem(PK, JSON.stringify(p)); } catch(e){}
    LSYNC.touch();
    LOG.event('lab', { code: a.code, what: 'started again' });
    renderActivity(a);
  });
}

function stepOf(a, key){
  const [pid, si] = key.split(':'); const p = a.parts.find(x => x.id === pid); return p && p.steps[+si];
}
function showPick(a, key, i, fresh){
  const s = stepOf(a, key); const t = s.predict || s.observe; const right = t.answer;
  $('act').querySelectorAll('[data-pick="' + key + '"]').forEach(b => {
    const bi = +b.dataset.i; b.disabled = true;
    b.classList.toggle('picked', bi === i);
    if (s.observe) b.classList.toggle('right', bi === right);
  });
  const v = $('v-' + cssKey(key));
  if (s.predict) v.textContent = 'Prediction noted. Now test it and see.';
  else v.textContent = i === right ? 'That is what happens.' : 'Look again — ' + t.options[right].toLowerCase() + '.';
  if (fresh){
    LOG.event('lab', { code: a.code, what: s.predict ? 'predicted' : 'observed', q: t.q, chose: t.options[i], correct: s.observe ? i === right : null });

async function markExplain(a, key){

function attachMic(ta){

  const stop = () => { if (!active && !rec) return; active=false; if (rec){ try{ rec.onend=null; rec.stop(); }catch(e){} rec=null; } ta.value=(base+finals).trimEnd().slice(0,800); idle(); };

/* ── diagrams: the app's shape vocabulary, drawn here the same way ── */
function svgFor(d){
  if (!d || !Array.isArray(d.shapes) || !d.shapes.length) return '';
  const vb = d.viewBox || '0 0 320 200', ink = 'var(--ink)', mid = 'var(--mid)';
  const fillOf = f => f === 'dark' ? 'var(--rule)' : f === 'light' ? 'var(--surface)' : 'none';
  let out = '', defs = '', usedArrow = false, usedHatch = false;
  d.shapes.forEach(s => {
    const dash = s.dashed ? ' stroke-dasharray="6 4"' : '';
    switch (s.type) {
      case 'rect': out += '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" fill="'+fillOf(s.fill)+'" stroke="'+ink+'" stroke-width="2"'+dash+'/>'; break;
      case 'circle': out += '<circle cx="'+s.cx+'" cy="'+s.cy+'" r="'+s.r+'" fill="'+fillOf(s.fill)+'" stroke="'+ink+'" stroke-width="2"'+dash+'/>'; break;
      case 'line': if (s.arrow) usedArrow = true;
        out += '<line x1="'+s.x1+'" y1="'+s.y1+'" x2="'+s.x2+'" y2="'+s.y2+'" stroke="'+ink+'" stroke-width="2"'+dash+(s.arrow?' marker-end="url(#ar)"':'')+'/>'; break;
      case 'arc': { const mx=(s.x1+s.x2)/2, my=(s.y1+s.y2)/2, b=s.bulge||20;
        out += '<path d="M'+s.x1+' '+s.y1+' Q'+(mx)+' '+(my+b)+' '+s.x2+' '+s.y2+'" fill="none" stroke="'+ink+'" stroke-width="2"'+dash+'/>'; break; }
      case 'water': { const y=s.y, w=s.w, x=s.x, step=w/4; let p='M'+x+' '+y;
        for (let i=0;i<4;i++){ p += ' q'+(step/4)+' -5 '+(step/2)+' 0 q'+(step/4)+' 5 '+(step/2)+' 0'; }
        out += '<path d="'+p+'" fill="none" stroke="'+ink+'" stroke-width="2"/><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+(s.h||20)+'" fill="var(--surface)" opacity=".7"/>'; break; }
      case 'hatch': usedHatch = true; out += '<rect x="'+s.x+'" y="'+s.y+'" width="'+s.w+'" height="'+s.h+'" fill="url(#ht)" stroke="'+ink+'" stroke-width="2"/>'; break;
    }
  });
  const vbW = parseFloat(String(vb).split(/\s+/)[2]) || 320, vbH = parseFloat(String(vb).split(/\s+/)[3]) || 200, LH = 13;
  const boxes = (d.labels||[]).map(l => { const txt = String(l.text||'').replace(/[<>&]/g,''); if (!txt) return null;
    const w = txt.length*5.6, tgt = (l.leaderTo && l.leaderTo.length===2) ? l.leaderTo : null, leftward = tgt ? tgt[0] < l.x : false;
    let x = l.x; if (leftward) x = Math.min(x, vbW-2); else x = Math.max(2, Math.min(x, vbW-w-2));
    return { txt, w, tgt, leftward, x, y: Math.max(LH, Math.min(+l.y||LH, vbH-3)) }; }).filter(Boolean);
  const span = bx => bx.leftward ? { l: bx.x-bx.w, r: bx.x } : { l: bx.x, r: bx.x+bx.w };
  const hits = (A,B) => { const a1=span(A), b1=span(B); return a1.l < b1.r+3 && b1.l < a1.r+3 && Math.abs(A.y-B.y) < LH; };

  boxes.forEach((bx,i) => { for (let j=0;j<i;j++){ if (!hits(bx, boxes[j])) continue; const down = boxes[j].y+LH; if (down <= vbH-3) bx.y = down; else { const up = boxes[j].y-LH; if (up >= LH) bx.y = up; } } });

    if (tgt){ const tl = leftward ? x-w : x, tr = leftward ? x : x+w; let fx, fy = y-4;

      out += '<line x1="'+fx.toFixed(1)+'" y1="'+fy.toFixed(1)+'" x2="'+tgt[0]+'" y2="'+tgt[1]+'" stroke="'+mid+'" stroke-width="1"/>'; }
    out += '<text x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" font-size="11" fill="'+mid+'" font-family="var(--body)"'+(leftward?' text-anchor="end"':'')+'>'+txt+'</text>'; });
  if (usedArrow) defs += '<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="'+ink+'"/></marker>';
  if (usedHatch) defs += '<pattern id="ht" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="7" stroke="'+mid+'" stroke-width="2"/></pattern>';
  return '<div class="dgm"><svg viewBox="'+vb+'" role="img" aria-label="Diagram">'+(defs?'<defs>'+defs+'</defs>':'')+out+'</svg></div>';
