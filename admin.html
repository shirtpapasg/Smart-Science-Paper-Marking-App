<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Science Marking · admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2a44;--bg:#fbfaf3;--card:#fff;--rule:#d5dbe7;--mid:#4d5b76;--accent:#1f8a4c;--pen-dark:#166b3b;--warn:#c9741b;--warn-bg:rgba(201,116,27,.12)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.55}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 60px}
  h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;margin:0 0 6px}
  .muted{color:var(--mid);font-size:14px}
  label{display:block;font-weight:700;margin:18px 0 6px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--card);color:var(--ink)}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,138,76,.12)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  button{font:inherit;font-weight:700;padding:12px 18px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 0 var(--pen-dark)}
  button:disabled{opacity:.5;cursor:default}
  #msg{margin-top:18px;padding:12px 14px;border-radius:10px;background:var(--card);border:1.5px solid var(--rule);display:none}
  #msg.err{background:var(--warn-bg);border-color:var(--warn)}
  table{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
  td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
  th{color:var(--mid);font-weight:700}
  .off{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Science Marking · admin</h1>
  <div class="muted">Give someone access, take it away, or send them a fresh sign-in link. The key is never stored on this device.</div>

  <label for="key">Admin key</label>
  <input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY from Vercel">

  <label for="email">Member's email</label>
  <input id="email" type="email" autocomplete="off" placeholder="name@example.com">

  <label for="guardian">Parent or guardian email (optional, gets the session reports too)</label>
  <input id="guardian" type="email" autocomplete="off" placeholder="parent@example.com">

  <label for="note">Note (optional, admin grants only)</label>
  <input id="note" type="text" maxlength="120" placeholder="e.g. tester, P5 tuition group">

  <div class="row">
    <button class="primary" data-a="grant">Give free access</button>
    <button data-a="resend">Resend sign-in link</button>
    <button data-a="revoke">Take access away</button>
    <button data-a="list">List members</button>
  </div>
  <div id="msg"></div>
  <div id="list"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(t, err){ const m = $('msg'); m.textContent = t; m.className = err ? 'err' : ''; m.style.display = 'block'; }

async function call(action){
  const key = $('key').value.trim(), email = $('email').value.trim(), note = $('note').value.trim(), guardian = $('guardian').value.trim();
  if (!key) return say('Enter the admin key first.', true);
  if (action !== 'list' && !email) return say('Enter the member\'s email.', true);
  if (action === 'revoke' && !confirm('Take access away from ' + email + '?')) return;
  document.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    const r = await fetch('/api/admin', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ key, action, email, note, guardian }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Request failed (' + r.status + ')');
    if (action === 'list'){
      const rows = (d.members || []);
      $('list').innerHTML = rows.length ? '<table><tr><th>Email</th><th>Source</th><th>Access</th><th>Guardian</th><th>Note</th></tr>' +
        rows.map(m => '<tr><td>' + esc(m.email) + '</td><td>' + esc(m.source) + '</td><td' + (m.active ? '' : ' class="off"') + '>' +
          (m.active ? 'yes' : 'off') + '</td><td>' + esc(m.guardian) + '</td><td>' + esc(m.note) + '</td></tr>').join('') + '</table>' : '<p class="muted">No members yet.</p>';
      say(rows.length + ' member' + (rows.length === 1 ? '' : 's') + '.');
    } else say(d.message || 'Done.');
  } catch(e){ say(e.message, true); }
  document.querySelectorAll('button').forEach(b => b.disabled = false);
}
document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => call(b.dataset.a));
</script>
</body>
</html>
